<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Solar System Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; }
    canvas { display: block; }

    /* ── HUD ── */
    #hud {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; z-index: 10;
    }

    /* Top bar */
    #topbar {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,.8), transparent);
      pointer-events: all;
    }
    #topbar h1 { font-size: 1.2rem; letter-spacing: 3px; text-transform: uppercase; color: #88ccff; }
    #topbar .tagline { font-size: .7rem; color: #557799; letter-spacing: 2px; }

    /* Speed controls */
    #controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; align-items: center;
      background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.1);
      padding: 10px 20px; border-radius: 30px;
      pointer-events: all;
    }
    #controls button {
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2);
      color: #fff; padding: 6px 14px; border-radius: 20px; cursor: pointer;
      font-size: .8rem; transition: background .2s;
    }
    #controls button:hover { background: rgba(255,255,255,.2); }
    #controls button.active { background: rgba(100,180,255,.3); border-color: #88ccff; }
    #speed-label { font-size: .75rem; color: #88ccff; min-width: 80px; text-align: center; }
    #controls input[type=range] { width: 140px; accent-color: #88ccff; cursor: pointer; }

    /* Planet labels */
    .planet-label {
      position: absolute; font-size: .65rem; color: rgba(200,220,255,.7);
      letter-spacing: 1px; text-transform: uppercase; pointer-events: none;
      text-shadow: 0 0 6px rgba(0,0,0,1);
      transform: translate(-50%, -50%);
    }

    /* Info panel */
    #info-panel {
      position: absolute; top: 70px; right: 20px;
      width: 260px; background: rgba(5,15,30,.85);
      border: 1px solid rgba(100,160,255,.3); border-radius: 12px;
      padding: 18px; display: none;
      pointer-events: all;
    }
    #info-panel.visible { display: block; }
    #info-panel h2 { font-size: 1rem; color: #88ccff; margin-bottom: 8px; }
    #info-panel .close-btn {
      position: absolute; top: 12px; right: 14px;
      background: none; border: none; color: #88ccff;
      font-size: 1rem; cursor: pointer;
    }
    #info-panel table { width: 100%; border-collapse: collapse; font-size: .72rem; }
    #info-panel tr td { padding: 4px 0; color: #aac; }
    #info-panel tr td:first-child { color: #668; padding-right: 10px; }
    #planet-desc { margin-top: 10px; font-size: .72rem; color: #7a9abc; line-height: 1.5; }

    /* Legend */
    #legend {
      position: absolute; top: 70px; left: 20px;
      background: rgba(5,15,30,.75); border: 1px solid rgba(100,160,255,.2);
      border-radius: 10px; padding: 12px 16px; font-size: .7rem;
      pointer-events: all;
    }
    #legend h3 { color: #88ccff; margin-bottom: 8px; font-size: .75rem; letter-spacing: 1px; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin: 5px 0; cursor: pointer; transition: opacity .2s; }
    .legend-item:hover { opacity: .75; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* Toggles */
    #toggles {
      position: absolute; bottom: 80px; right: 20px;
      display: flex; flex-direction: column; gap: 6px;
      pointer-events: all;
    }
    #toggles button {
      background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.15);
      color: #aac; padding: 6px 12px; border-radius: 8px; cursor: pointer;
      font-size: .72rem; text-align: left; transition: all .2s;
    }
    #toggles button.on { border-color: #88ccff; color: #88ccff; }

    /* Loading */
    #loading {
      position: fixed; inset: 0; background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; transition: opacity .5s;
    }
    #loading h2 { color: #88ccff; letter-spacing: 4px; margin-bottom: 16px; }
    #loading-bar-wrap { width: 240px; height: 3px; background: rgba(255,255,255,.1); border-radius: 2px; }
    #loading-bar { height: 100%; width: 0; background: #88ccff; border-radius: 2px; transition: width .2s; }

    /* Date display */
    #date-display {
      position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
      font-size: .7rem; color: #557799; letter-spacing: 2px;
      background: rgba(0,0,0,.4); padding: 4px 12px; border-radius: 10px;
    }
  </style>
</head>
<body>

<div id="loading">
  <h2>SOLAR SYSTEM</h2>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
</div>

<div id="hud">
  <div id="topbar">
    <div>
      <h1>Solar System</h1>
      <div class="tagline">Interactive 3D Simulator</div>
    </div>
    <div style="display:flex;gap:10px;font-size:.7rem;color:#557799;">
      <span>Click a planet to inspect</span>
      <span>|</span>
      <span>Scroll to zoom</span>
      <span>|</span>
      <span>Drag to orbit</span>
    </div>
  </div>

  <div id="date-display">Loading...</div>

  <!-- Legend -->
  <div id="legend">
    <h3>Planets</h3>
    <!-- filled by JS -->
  </div>

  <!-- Info panel -->
  <div id="info-panel">
    <h2 id="panel-name">—</h2>
    <button class="close-btn" id="panel-close">✕</button>
    <table id="panel-table"></table>
    <div id="planet-desc"></div>
  </div>

  <!-- Toggle buttons -->
  <div id="toggles">
    <button id="tog-orbits" class="on">Orbits</button>
    <button id="tog-labels" class="on">Labels</button>
    <button id="tog-stars" class="on">Stars</button>
    <button id="tog-asteroids" class="on">Asteroid Belt</button>
    <button id="tog-shadows" class="on">Shadows</button>
  </div>

  <!-- Speed controls -->
  <div id="controls">
    <button id="btn-reverse">⏮ Rev</button>
    <button id="btn-pause">⏸</button>
    <button id="btn-play" class="active">▶</button>
    <input type="range" id="speed-slider" min="-3" max="3" step="0.05" value="0" />
    <span id="speed-label">1× speed</span>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js';

// ─── Texture loader with progress ───────────────────────────────────────────
const loader = new THREE.TextureLoader();
let loaded = 0, total = 0;
function loadTex(url) {
  total++;
  return loader.loadAsync(url).then(t => { loaded++; setProgress(loaded/total); return t; });
}
function setProgress(v) {
  document.getElementById('loading-bar').style.width = (v*100)+'%';
}

// ─── Planet data ─────────────────────────────────────────────────────────────
// Distances / sizes are artistic (not to scale) but proportional feel
const PLANET_DATA = [
  {
    name:'Mercury', color:'#b5b5b5',
    radius: 0.38, distance: 9,  tilt: 0.03, rotPeriod: 58.6,  orbPeriod: 0.241,
    tex:'https://www.solarsystemscope.com/textures/download/2k_mercury.jpg',
    info:{ Diameter:'4,879 km', Mass:'3.3×10²³ kg', 'Day':'59 Earth days', Year:'88 Earth days', Moons:'0', Temp:'167°C avg' },
    desc:'The smallest planet and closest to the Sun. Its surface is heavily cratered and has no atmosphere to retain heat.'
  },
  {
    name:'Venus', color:'#e8cda0',
    radius: 0.95, distance: 13, tilt: 177.4, rotPeriod: -243, orbPeriod: 0.615,
    tex:'https://www.solarsystemscope.com/textures/download/2k_venus_surface.jpg',
    info:{ Diameter:'12,104 km', Mass:'4.87×10²⁴ kg', 'Day':'243 Earth days', Year:'225 Earth days', Moons:'0', Temp:'465°C avg' },

  },
  {

    tex:'https://www.solarsystemscope.com/textures/download/2k_earth_daymap.jpg',
    cloudTex:'https://www.solarsystemscope.com/textures/download/2k_earth_clouds.jpg',
    info:{ Diameter:'12,742 km', Mass:'5.97×10²⁴ kg', 'Day':'24 hours', Year:'365.25 days', Moons:'1', Temp:'15°C avg' },

  },
  {
    name:'Mars', color:'#c1440e',
    radius: 0.53, distance: 22, tilt: 25.2, rotPeriod: 1.03,  orbPeriod: 1.881,
    tex:'https://www.solarsystemscope.com/textures/download/2k_mars.jpg',
    info:{ Diameter:'6,779 km', Mass:'6.39×10²³ kg', 'Day':'24.6 hours', Year:'687 days', Moons:'2', Temp:'-65°C avg' },
    desc:'The Red Planet hosts the tallest volcano (Olympus Mons) and deepest canyon (Valles Marineris) in the solar system.'
  },
  {
    name:'Jupiter', color:'#c88b3a',
    radius: 3.5,  distance: 34, tilt: 3.1, rotPeriod: 0.41,  orbPeriod: 11.86,
    tex:'https://www.solarsystemscope.com/textures/download/2k_jupiter.jpg',
    info:{ Diameter:'139,820 km', Mass:'1.90×10²⁷ kg', 'Day':'10 hours', Year:'11.9 years', Moons:'95', Temp:'-110°C avg' },
    desc:'The largest planet — a gas giant with a centuries-old storm (the Great Red Spot) twice the size of Earth.'
  },
  {
    name:'Saturn', color:'#e4d191',
    radius: 3.0,  distance: 47, tilt: 26.7, rotPeriod: 0.45,  orbPeriod: 29.46,
    tex:'https://www.solarsystemscope.com/textures/download/2k_saturn.jpg',
    ringTex:'https://www.solarsystemscope.com/textures/download/2k_saturn_ring_alpha.png',
    info:{ Diameter:'116,460 km', Mass:'5.68×10²⁶ kg', 'Day':'10.7 hours', Year:'29.5 years', Moons:'146', Temp:'-140°C avg' },
    desc:'Famous for its spectacular ring system made of ice and rock. Less dense than water — it would float!'
  },
  {
    name:'Uranus', color:'#7de8e8',
    radius: 2.0,  distance: 60, tilt: 97.8, rotPeriod: -0.72, orbPeriod: 84.01,
    tex:'https://www.solarsystemscope.com/textures/download/2k_uranus.jpg',
    info:{ Diameter:'50,724 km', Mass:'8.68×10²⁵ kg', 'Day':'17.2 hours', Year:'84 years', Moons:'28', Temp:'-195°C avg' },
    desc:'An ice giant that rotates on its side. Its extreme axial tilt causes 42-year-long polar days and nights.'
  },
  {
    name:'Neptune', color:'#3f54ba',
    radius: 1.9,  distance: 73, tilt: 28.3, rotPeriod: 0.67,  orbPeriod: 164.8,
    tex:'https://www.solarsystemscope.com/textures/download/2k_neptune.jpg',
    info:{ Diameter:'49,244 km', Mass:'1.02×10²⁶ kg', 'Day':'16.1 hours', Year:'165 years', Moons:'16', Temp:'-200°C avg' },
    desc:'The windiest planet — storms can reach 2,100 km/h. Its largest moon Triton orbits in reverse.'
  }

// ─── Scene setup ─────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 10000);
camera.position.set(0, 40, 90);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 500;
controls.target.set(0,0,0);

// Raycaster for clicks
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// ─── Starfield ───────────────────────────────────────────────────────────────
let starField;
function buildStars() {
  const geo = new THREE.BufferGeometry();
  const n = 15000;
  const pos = new Float32Array(n*3);
  const col = new Float32Array(n*3);
  for (let i=0; i<n; i++) {
    const r = 800 + Math.random()*1200;
    const th = Math.random()*Math.PI*2;
    const ph = Math.acos(2*Math.random()-1);
    pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.sin(ph)*Math.sin(th);
    pos[i*3+2] = r*Math.cos(ph);
    const t = Math.random();
    col[i*3]   = 0.8+t*0.2;
    col[i*3+1] = 0.8+t*0.1;
    col[i*3+2] = 0.8+Math.random()*0.2;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  const mat = new THREE.PointsMaterial({ size:.5, vertexColors:true, sizeAttenuation:true });
  starField = new THREE.Points(geo, mat);
  scene.add(starField);
}
buildStars();

// ─── Sun ─────────────────────────────────────────────────────────────────────
let sunMesh, sunGlow, sunLight;

async function buildSun() {
  const sunTex = await loadTex('https://www.solarsystemscope.com/textures/download/2k_sun.jpg');
  const geo = new THREE.SphereGeometry(5, 64, 64);
  const mat = new THREE.MeshBasicMaterial({ map: sunTex });
  sunMesh = new THREE.Mesh(geo, mat);
  scene.add(sunMesh);

  // Glow
  const glowGeo = new THREE.SphereGeometry(5.4, 32, 32);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0xffdd55, transparent: true, opacity: 0.18, side: THREE.BackSide
  });
  sunGlow = new THREE.Mesh(glowGeo, glowMat);
  scene.add(sunGlow);

  // Outer corona
  const coronaGeo = new THREE.SphereGeometry(6.5, 32, 32);
  const coronaMat = new THREE.MeshBasicMaterial({
    color: 0xff8800, transparent: true, opacity: 0.06, side: THREE.BackSide
  });
  scene.add(new THREE.Mesh(coronaGeo, coronaMat));

  // Point light from sun
  sunLight = new THREE.PointLight(0xfff5e0, 3, 600);
  scene.add(sunLight);

  // Ambient
  scene.add(new THREE.AmbientLight(0x111122, 1));
}

// ─── Orbit lines ─────────────────────────────────────────────────────────────
const orbitLines = [];
function buildOrbit(distance, color='#334466') {
  const points = [];
  const segs = 256;
  for (let i=0; i<=segs; i++) {
    const a = (i/segs)*Math.PI*2;
    points.push(new THREE.Vector3(Math.cos(a)*distance, 0, Math.sin(a)*distance));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({ color, transparent:true, opacity:0.3 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  orbitLines.push(line);
  return line;
}

// ─── Planet builder ───────────────────────────────────────────────────────────
const planetObjects = []; // { data, pivot, mesh, label, angle, clouds? }

async function buildPlanet(data) {
  const tex = await loadTex(data.tex);

  // Pivot for orbital motion
  const pivot = new THREE.Object3D();
  scene.add(pivot);

  // Group for axial tilt
  const group = new THREE.Object3D();
  group.rotation.z = THREE.MathUtils.degToRad(data.tilt || 0);
  pivot.add(group);

  // Sphere
  const geo = new THREE.SphereGeometry(data.radius, 48, 48);
  const mat = new THREE.MeshStandardMaterial({
    map: tex, roughness: 0.85, metalness: 0.05
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.position.x = data.distance;
  group.add(mesh);

  // Clouds (Earth only)
  let clouds = null;
  if (data.cloudTex) {
    const cTex = await loadTex(data.cloudTex);
    const cGeo = new THREE.SphereGeometry(data.radius*1.015, 48, 48);
    const cMat = new THREE.MeshStandardMaterial({
      map: cTex, transparent:true, opacity:0.6, depthWrite:false
    });
    clouds = new THREE.Mesh(cGeo, cMat);
    clouds.position.copy(mesh.position);
    group.add(clouds);
  }

  // Saturn rings
  if (data.ringTex) {
    const rTex = await loadTex(data.ringTex);
    const rGeo = new THREE.RingGeometry(data.radius*1.25, data.radius*2.35, 128);
    // UV remap for ring texture
    const pos = rGeo.attributes.position;
    const uv = rGeo.attributes.uv;
    for (let i=0; i<pos.count; i++) {
      const v = new THREE.Vector3().fromBufferAttribute(pos,i);
      const len = v.length();
      const mn = data.radius*1.25, mx = data.radius*2.35;
      uv.setXY(i, (len-mn)/(mx-mn), 0);
    }
    const rMat = new THREE.MeshBasicMaterial({
      map:rTex, side:THREE.DoubleSide, transparent:true, opacity:0.9
    });
    const ring = new THREE.Mesh(rGeo, rMat);
    ring.rotation.x = -Math.PI/2;
    ring.position.copy(mesh.position);
    group.add(ring);
  }

  // Label
  const label = document.createElement('div');
  label.className = 'planet-label';
  label.textContent = data.name;
  document.getElementById('hud').appendChild(label);

  // Orbit ring
  buildOrbit(data.distance);

  // Click hitbox (invisible larger sphere)
  const hitGeo = new THREE.SphereGeometry(data.radius*2, 16, 16);
  const hitMat = new THREE.MeshBasicMaterial({ visible:false });
  const hitMesh = new THREE.Mesh(hitGeo, hitMat);
  hitMesh.position.copy(mesh.position);
  group.add(hitMesh);
  hitMesh.userData = { planetName: data.name };

  const angle = Math.random()*Math.PI*2; // random start
  planetObjects.push({ data, pivot, group, mesh, clouds, label, hitMesh, angle });

  // Legend
  const li = document.createElement('div');
  li.className = 'legend-item';
  li.innerHTML = `<div class="legend-dot" style="background:${data.color}"></div><span>${data.name}</span>`;
  li.addEventListener('click', () => focusPlanet(data.name));
  document.getElementById('legend').appendChild(li);
}

// ─── Asteroid belt ───────────────────────────────────────────────────────────
let asteroidBelt;
function buildAsteroidBelt() {
  const count = 3000;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  for (let i=0; i<count; i++) {
    const r = 26 + (Math.random()-0.5)*4;
    const a = Math.random()*Math.PI*2;
    const y = (Math.random()-0.5)*0.8;
    pos[i*3]   = Math.cos(a)*r;
    pos[i*3+1] = y;
    pos[i*3+2] = Math.sin(a)*r;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({ color:0x888866, size:0.12, sizeAttenuation:true });
  asteroidBelt = new THREE.Points(geo, mat);
  scene.add(asteroidBelt);
}

// ─── UI helpers ──────────────────────────────────────────────────────────────
function showPlanetPanel(name) {
  const pd = PLANET_DATA.find(p=>p.name===name);
  if (!pd) return;
  document.getElementById('panel-name').textContent = pd.name;
  const tbl = document.getElementById('panel-table');
  tbl.innerHTML = '';
  for (const [k,v] of Object.entries(pd.info)) {
    tbl.innerHTML += `<tr><td>${k}</td><td>${v}</td></tr>`;
  }
  document.getElementById('planet-desc').textContent = pd.desc;
  document.getElementById('info-panel').classList.add('visible');
}
document.getElementById('panel-close').onclick = () =>
  document.getElementById('info-panel').classList.remove('visible');

function focusPlanet(name) {
  const obj = planetObjects.find(p=>p.data.name===name);
  if (!obj) return;
  showPlanetPanel(name);
  const worldPos = new THREE.Vector3();
  obj.mesh.getWorldPosition(worldPos);
  const d = obj.data.radius * 8 + 10;
  camera.position.set(worldPos.x + d, worldPos.y + d*0.4, worldPos.z + d);
  controls.target.copy(worldPos);
}

// ─── Speed / time ────────────────────────────────────────────────────────────
let simSpeed = 1; // 1 = ~1 orbit of Earth/year in ~30s
let paused = false;
let simTime = 0;

const slider = document.getElementById('speed-slider');
const speedLabel = document.getElementById('speed-label');
slider.addEventListener('input', () => {
  const v = parseFloat(slider.value);
  simSpeed = Math.pow(10, v);
  updateSpeedLabel();
});
function updateSpeedLabel() {
  const v = simSpeed;
  if (v>=1) speedLabel.textContent = v.toFixed(v>=10?0:1)+'× speed';
  else speedLabel.textContent = (1/v).toFixed(1)+'× slow';
}
document.getElementById('btn-pause').onclick = () => { paused = true; };
document.getElementById('btn-play').onclick = () => { paused = false; if(simSpeed<0) simSpeed=Math.abs(simSpeed); slider.value=0; updateSpeedLabel(); };
document.getElementById('btn-reverse').onclick = () => { paused = false; simSpeed = -Math.abs(simSpeed)||(-1); slider.value=-1; updateSpeedLabel(); };

// Toggle buttons
function togBtn(id, obj, prop, cb) {
  const btn = document.getElementById(id);
  btn.onclick = () => {
    btn.classList.toggle('on');
    cb(btn.classList.contains('on'));
  };
}
togBtn('tog-orbits', null, null, on => orbitLines.forEach(l=>l.visible=on));
togBtn('tog-labels', null, null, on => planetObjects.forEach(p=>{p.label.style.display=on?'':'none';}));
togBtn('tog-stars', null, null, on => { if(starField) starField.visible=on; });
togBtn('tog-asteroids', null, null, on => { if(asteroidBelt) asteroidBelt.visible=on; });
togBtn('tog-shadows', null, null, on => {
  renderer.shadowMap.enabled=on;
  planetObjects.forEach(p=>{ p.mesh.castShadow=on; p.mesh.receiveShadow=on; });
});

// ─── Labels (projected) ──────────────────────────────────────────────────────
function updateLabels() {
  planetObjects.forEach(p => {
    const wp = new THREE.Vector3();
    p.mesh.getWorldPosition(wp);
    const proj = wp.clone().project(camera);
    const x = (proj.x*0.5+0.5)*innerWidth;
    const y = (-proj.y*0.5+0.5)*innerHeight;
    p.label.style.left = x+'px';
    p.label.style.top  = (y - p.data.radius*30 - 12)+'px';
    p.label.style.display = proj.z < 1 ? '' : 'none';
  });
}

// ─── Date display ────────────────────────────────────────────────────────────
const startDate = new Date('2000-01-01');
function updateDateDisplay() {
  const d = new Date(startDate.getTime() + simTime * 365.25 * 24*3600*1000);
  document.getElementById('date-display').textContent = d.toDateString().toUpperCase();
}

// ─── Click handler ───────────────────────────────────────────────────────────
renderer.domElement.addEventListener('click', e => {
  mouse.x = (e.clientX/innerWidth)*2-1;
  mouse.y = -(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = [];
  planetObjects.forEach(p => {
    const result = raycaster.intersectObject(p.hitMesh);
    if (result.length) hits.push({ name: p.data.name, dist: result[0].distance });
  });
  // Also hit sun
  if (sunMesh) {
    const s = raycaster.intersectObject(sunMesh);
    if (s.length) hits.push({ name: 'Sun', dist: s[0].distance });
  }
  if (hits.length) {
    hits.sort((a,b)=>a.dist-b.dist);
    const name = hits[0].name;
    if (name === 'Sun') {
      document.getElementById('panel-name').textContent = 'Sun';
      document.getElementById('panel-table').innerHTML = `
        <tr><td>Diameter</td><td>1,392,700 km</td></tr>
        <tr><td>Mass</td><td>1.99×10³⁰ kg</td></tr>
        <tr><td>Type</td><td>G-type main-seq.</td></tr>
        <tr><td>Age</td><td>4.6 billion years</td></tr>
        <tr><td>Temp (surface)</td><td>5,500°C</td></tr>
        <tr><td>Temp (core)</td><td>15,000,000°C</td></tr>
      `;
      document.getElementById('planet-desc').textContent = 'Our star — a nearly perfect sphere of hot plasma that contains 99.86% of the solar system\'s total mass.';
      document.getElementById('info-panel').classList.add('visible');
    } else {
      focusPlanet(name);
    }
  }
});

// ─── Resize ──────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── Main init ───────────────────────────────────────────────────────────────
async function init() {
  await buildSun();
  for (const pd of PLANET_DATA) await buildPlanet(pd);
  buildAsteroidBelt();

  // Hide loading
  const ld = document.getElementById('loading');
  ld.style.opacity = '0';
  setTimeout(()=>ld.remove(), 600);

  animate();
}

// ─── Animation loop ──────────────────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if (!paused) {
    // simSpeed=1 → 1 Earth year per ~30s realtime
    const yearPerSec = simSpeed / 30;
    simTime += yearPerSec * dt;
  }

  // Sun rotation
  if (sunMesh) {
    sunMesh.rotation.y += 0.002 * (paused ? 0 : Math.sign(simSpeed)||1);
    // pulse glow
    const p = Math.sin(Date.now()*0.001)*0.02;
    sunGlow.scale.setScalar(1+p);
  }

  // Planets
  planetObjects.forEach(p => {
    const { data } = p;
    // Orbital angle
    const ω = (simTime / data.orbPeriod) * Math.PI * 2;
    p.pivot.rotation.y = ω;

    // Self-rotation
    const rotSpeed = paused ? 0 : (0.01 / Math.abs(data.rotPeriod||1)) * Math.sign(data.rotPeriod||1) * Math.sign(simSpeed||1);
    p.mesh.rotation.y += rotSpeed * 10;
    if (p.clouds) p.clouds.rotation.y += rotSpeed * 10 * 1.1;
  });

  // Asteroid belt slow rotation
  if (asteroidBelt && !paused) asteroidBelt.rotation.y += 0.0002 * Math.sign(simSpeed||1);

  controls.update();
  updateLabels();
  if (!paused) updateDateDisplay();
  renderer.render(scene, camera);
}

init();
</script>
